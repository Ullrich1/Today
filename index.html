<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Today</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Today">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0b;
    --surface: #111113;
    --surface2: #1a1a1e;
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.13);
    --text: #f0ede8;
    --text-muted: rgba(240,237,232,0.4);
    --text-dim: rgba(240,237,232,0.2);
    --accent: #e8d5a3;
    --accent-dim: rgba(232,213,163,0.15);
    --green: #4ade80;
    --green-dim: rgba(74,222,128,0.12);
    --red: #f87171;
    --red-dim: rgba(248,113,113,0.12);
    --hour-height: 72px;
    --font-mono: 'DM Mono', monospace;
    --font-display: 'Syne', sans-serif;
  }
  [data-theme="light"] {
    --bg: #f5f2ed;
    --surface: #ffffff;
    --surface2: #ede9e2;
    --border: rgba(0,0,0,0.08);
    --border-hover: rgba(0,0,0,0.15);
    --text: #1a1814;
    --text-muted: rgba(26,24,20,0.45);
    --text-dim: rgba(26,24,20,0.2);
    --accent: #7c5c1e;
    --accent-dim: rgba(124,92,30,0.1);
    --green-dim: rgba(22,163,74,0.1);
    --red-dim: rgba(220,38,38,0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: var(--font-display); color: var(--text); display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; }

  /* HEADER */
  #header {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    z-index: 10;
  }
  #header-left { display: flex; align-items: center; gap: 10px; }
  #settings-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: border-color 0.2s;
    font-size: 15px;
  }
  #settings-btn:hover { border-color: var(--border-hover); }
  #date-display { font-size: 13px; color: var(--text-muted); font-family: var(--font-mono); letter-spacing: 0.03em; }
  #stats-display { display: flex; align-items: center; gap: 8px; }
  .stat-pill {
    display: flex; align-items: center; gap: 4px;
    padding: 4px 8px; border-radius: 20px;
    font-family: var(--font-mono); font-size: 12px; font-weight: 500;
  }
  .stat-pill.green { background: var(--green-dim); color: var(--green); }
  .stat-pill.red { background: var(--red-dim); color: var(--red); }
  .stat-dot { width: 6px; height: 6px; border-radius: 50%; }
  .stat-pill.green .stat-dot { background: var(--green); }
  .stat-pill.red .stat-dot { background: var(--red); }

  /* SCROLL AREA */
  #scroll-area {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    position: relative;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  #scroll-area::-webkit-scrollbar { width: 3px; }
  #scroll-area::-webkit-scrollbar-track { background: transparent; }
  #scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* HOUR CONTAINERS */
  .hour-block {
    display: flex; align-items: stretch;
    min-height: var(--hour-height);
    border-bottom: 1px solid var(--border);
    transition: background 0.3s;
    position: relative;
  }
  .hour-block.current {
    background: var(--accent-dim);
    border-bottom-color: rgba(232,213,163,0.15);
  }
  .hour-block.past {
    opacity: 0.38;
    filter: saturate(0.3);
    background: rgba(0,0,0,0.18);
    pointer-events: none;
  }
  [data-theme="light"] .hour-block.past {
    background: rgba(0,0,0,0.04);
  }
  .hour-block.past .task-area { cursor: default; }
  .hour-block.past .task-item { cursor: default; }

  /* TIME LABEL */
  .hour-label {
    flex-shrink: 0; width: 52px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 10px 0 0;
    border-right: 1px solid var(--border);
    position: relative;
  }
  .hour-label-time {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--text-muted); letter-spacing: -0.01em; font-weight: 300;
  }
  .hour-label-icon { font-size: 10px; margin-top: 3px; opacity: 0.5; }
  .minute-markers { display: flex; flex-direction: column; gap: 0; position: absolute; right: -1px; top: 36px; }
  .minute-marker {
    width: 5px; height: 1px; background: var(--border);
    margin: 15px 0;
  }

  /* TASK AREA */
  .task-area {
    flex: 1; padding: 6px 10px 6px 10px;
    display: flex; flex-direction: column; gap: 4px;
    cursor: pointer;
    min-height: var(--hour-height);
  }

  /* TASKS */
  .task-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer; transition: all 0.18s;
    user-select: none; position: relative;
    animation: taskIn 0.2s ease;
  }
  @keyframes taskIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .task-item:active { transform: scale(0.98); }
  .task-indicator {
    width: 5px; height: 5px; border-radius: 50%;
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .task-text {
    font-size: 13px; line-height: 1.3; flex: 1;
    font-family: var(--font-display); font-weight: 400;
    transition: opacity 0.2s;
  }
  .task-item.done .task-text { opacity: 0.4; text-decoration: line-through; }
  .task-item.done .task-indicator { background: var(--green); }
  .task-item.incomplete-past .task-indicator { background: var(--red); }
  .task-item.future .task-indicator { background: var(--text-dim); }
  .task-item.current-hour .task-indicator { background: var(--accent); }

  .task-limit-msg {
    font-size: 11px; color: var(--text-dim); font-family: var(--font-mono);
    padding: 4px 2px; font-weight: 300; font-style: italic;
  }

  /* FLOATING TIME INDICATOR */
  #time-indicator {
    position: fixed; left: 0; right: 0;
    display: flex; align-items: center;
    pointer-events: none; z-index: 20;
    will-change: transform;
  }
  #time-needle {
    position: relative; display: flex; align-items: center;
    width: 100%;
  }
  #time-label {
    position: absolute; left: 4px;
    font-family: var(--font-mono); font-size: 10px; font-weight: 500;
    color: var(--accent); letter-spacing: -0.01em;
    top: -16px; white-space: nowrap;
    opacity: 0.9;
  }
  #time-needle::after {
    content: ''; position: absolute;
    left: 52px; top: 50%; transform: translateY(-50%);
    width: calc(100% - 52px); height: 1px;
    background: linear-gradient(to right, var(--accent), transparent);
    opacity: 0.4;
  }
  #time-dot {
    position: absolute; left: 44px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--accent);
    animation: pulse 2s ease-in-out infinite;
    transform: translateY(-50%);
    top: 50%;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--accent); }
    50% { box-shadow: 0 0 0 2px var(--bg), 0 0 0 5px var(--accent); opacity: 0.7; }
  }

  /* OVERLAYS */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
    display: flex; align-items: flex-end; justify-content: center;
    padding: 0;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .sheet {
    background: var(--surface); border-radius: 20px 20px 0 0;
    width: 100%; max-width: 480px; padding: 20px 20px 36px;
    animation: slideUp 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
    border-top: 1px solid var(--border);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

  .sheet-handle {
    width: 36px; height: 4px; border-radius: 2px;
    background: var(--border-hover); margin: 0 auto 16px;
  }
  .sheet-title {
    font-size: 16px; font-weight: 700; margin-bottom: 16px;
    color: var(--text);
  }

  /* INPUT */
  .task-input {
    width: 100%; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; font-size: 15px;
    color: var(--text); font-family: var(--font-display);
    outline: none; transition: border-color 0.2s;
    resize: none;
  }
  .task-input:focus { border-color: var(--accent); }
  .char-count { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); text-align: right; margin-top: 4px; }

  /* SHEET ACTIONS */
  .sheet-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .action-btn {
    width: 100%; padding: 13px 16px; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface2);
    color: var(--text); font-family: var(--font-display);
    text-align: left; transition: all 0.15s;
  }
  .action-btn:hover { background: var(--border); }
  .action-btn.primary { background: var(--accent); color: #1a1400; border-color: transparent; }
  .action-btn.primary:hover { opacity: 0.9; }
  .action-btn.danger { color: var(--red); }
  .action-btn.cancel { color: var(--text-muted); }

  /* HOUR SELECT */
  .hour-select {
    width: 100%; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; font-size: 14px;
    color: var(--text); font-family: var(--font-mono);
    outline: none; cursor: pointer;
    appearance: none; margin-top: 6px;
  }
  .hour-select:focus { border-color: var(--accent); }

  /* SETTINGS PANEL */
  .settings-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0; border-bottom: 1px solid var(--border);
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-label { font-size: 14px; color: var(--text); font-weight: 500; }
  .settings-desc { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 2px; }

  /* TOGGLE */
  .toggle {
    width: 44px; height: 24px; border-radius: 12px;
    background: var(--surface2); border: 1px solid var(--border);
    position: relative; cursor: pointer; transition: background 0.2s;
    flex-shrink: 0;
  }
  .toggle.on { background: var(--accent); border-color: transparent; }
  .toggle-thumb {
    position: absolute; top: 2px; left: 2px;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--text-muted); transition: all 0.2s;
  }
  .toggle.on .toggle-thumb { left: 22px; background: #1a1400; }

  /* COLOR SWATCHES */
  .color-swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .color-swatch {
    width: 28px; height: 28px; border-radius: 50%;
    cursor: pointer; border: 2px solid transparent;
    transition: transform 0.15s;
  }
  .color-swatch.active { border-color: var(--text); transform: scale(1.15); }
  .color-swatch:hover { transform: scale(1.1); }

  /* TOAST */
  #toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 20px;
    font-size: 13px; color: var(--text-muted); font-family: var(--font-mono);
    z-index: 200; pointer-events: none;
    opacity: 0; transition: opacity 0.2s;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; }

  /* FADE past tasks */
  .hour-block.past .task-item:not(.incomplete-past) { opacity: 0.5; }
</style>
</head>
<body>

<div id="header">
  <div id="header-left">
    <div id="settings-btn">⚙</div>
    <div id="date-display">—</div>
  </div>
  <div id="stats-display">
    <div class="stat-pill green"><span class="stat-dot"></span><span id="stat-done">0</span></div>
    <div class="stat-pill red"><span class="stat-dot"></span><span id="stat-miss">0</span></div>
    <div class="stat-pill" id="stat-day-pct" style="background:var(--surface2);color:var(--text-muted);font-family:var(--font-mono);font-size:11px;">0%</div>
  </div>
</div>

<div id="scroll-area">
  <div id="hours-container"></div>
</div>

<div id="time-indicator">
  <div id="time-needle">
    <div id="time-label">00:00</div>
    <div id="time-dot"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'today-planner-v1';
const COLORS = {
  amber: '#e8d5a3',
  rose:  '#f9a8b4',
  sky:   '#7dd3fc',
  sage:  '#86efac',
  lav:   '#c4b5fd',
};

let state = {
  tasks: {},       // hour (0-23) -> [{id, text, done}]
  settings: {
    format24: true,
    minuteMode: false,
    theme: 'dark',
    accentColor: 'amber',
  },
  date: todayStr(),
};

// ── HELPERS ────────────────────────────────────────────────────────────────
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved.date !== todayStr()) {
      // reset — new day
      localStorage.removeItem(STORAGE_KEY);
      return;
    }
    state = { ...state, ...saved };
  } catch(e) {}
}

function save() {
  state.date = todayStr();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function uid() {
  return Math.random().toString(36).slice(2, 9);
}

function now() {
  return new Date();
}

function formatHour(h) {
  if (state.settings.format24) {
    return h.toString().padStart(2, '0') + ':00';
  } else {
    const ampm = h < 12 ? 'AM' : 'PM';
    const h12 = h % 12 || 12;
    return `${h12}${ampm}`;
  }
}

function formatHourSelect(h) {
  if (state.settings.format24) return h.toString().padStart(2, '0') + ':00–' + h.toString().padStart(2,'0') + ':59';
  const ampm = h < 12 ? 'AM' : 'PM';
  const h12 = h % 12 || 12;
  const ampmEnd = (h+1 < 24 ? ((h+1) < 12 ? 'AM' : 'PM') : 'AM');
  const h12e = ((h+1) % 12) || 12;
  return `${h12}:00 ${ampm} – ${h12e}:00 ${ampmEnd}`;
}

function isDay(h) { return h >= 6 && h <= 17; }

function getStats() {
  let done = 0, miss = 0;
  const h = now().getHours();
  for (let i = 0; i < 24; i++) {
    const tasks = state.tasks[i] || [];
    tasks.forEach(t => {
      if (t.done) done++;
      else if (i < h) miss++;
    });
  }
  return { done, miss };
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 1800);
}

// ── RENDER ─────────────────────────────────────────────────────────────────
let headerOffset = 0;

function render() {
  applyTheme();
  renderHeader();
  renderHours();
  updateTimeIndicator();
}

function applyTheme() {
  document.documentElement.dataset.theme = state.settings.theme;
  const col = COLORS[state.settings.accentColor] || COLORS.amber;
  document.documentElement.style.setProperty('--accent', col);
  // derive dim
  document.documentElement.style.setProperty('--accent-dim', col + '1a');
}

function renderHeader() {
  const d = now();
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('date-display').textContent =
    `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;

  const s = getStats();
  document.getElementById('stat-done').textContent = s.done;
  document.getElementById('stat-miss').textContent = s.miss;
}

function renderHours() {
  const container = document.getElementById('hours-container');
  const curH = now().getHours();
  const existing = container.querySelectorAll('.hour-block');

  for (let h = 0; h < 24; h++) {
    let block = container.querySelector(`[data-hour="${h}"]`);
    if (!block) {
      block = document.createElement('div');
      block.className = 'hour-block';
      block.dataset.hour = h;
      container.appendChild(block);
    }
    block.className = 'hour-block' +
      (h === curH ? ' current' : h < curH ? ' past' : ' future');
    renderHourBlock(block, h, curH);
  }

  headerOffset = document.getElementById('header').offsetHeight;
}

function renderHourBlock(block, h, curH) {
  block.innerHTML = '';

  const label = document.createElement('div');
  label.className = 'hour-label';

  const timeEl = document.createElement('div');
  timeEl.className = 'hour-label-time';
  timeEl.textContent = formatHour(h);
  label.appendChild(timeEl);

  const icon = document.createElement('div');
  icon.className = 'hour-label-icon';
  icon.textContent = isDay(h) ? '☀' : '☾';
  label.appendChild(icon);

  if (state.settings.minuteMode) {
    const markers = document.createElement('div');
    markers.className = 'minute-markers';
    [':00', ':30'].forEach(m => {
      const mk = document.createElement('div');
      mk.className = 'minute-marker';
      label.appendChild(mk);
    });
    label.appendChild(markers);
  }

  block.appendChild(label);

  const area = document.createElement('div');
  area.className = 'task-area';

  const tasks = state.tasks[h] || [];

  tasks.forEach((task, idx) => {
    const item = document.createElement('div');
    item.className = 'task-item';
    if (task.done) item.classList.add('done');
    else if (h < curH) item.classList.add('incomplete-past');
    else if (h === curH) item.classList.add('current-hour');
    else item.classList.add('future');
    item.dataset.taskId = task.id;

    const dot = document.createElement('div');
    dot.className = 'task-indicator';
    item.appendChild(dot);

    const txt = document.createElement('div');
    txt.className = 'task-text';
    txt.textContent = task.text;
    item.appendChild(txt);

    // tap = toggle (past tasks are locked)
    let pressTimer;
    if (h < curH) {
      // past hour: no interactions
    } else {
      item.addEventListener('pointerdown', (e) => {
        pressTimer = setTimeout(() => {
          pressTimer = null;
          openEditSheet(h, task.id);
        }, 500);
      });
      item.addEventListener('pointerup', (e) => {
        if (pressTimer) {
          clearTimeout(pressTimer);
          pressTimer = null;
          toggleTask(h, task.id);
        }
      });
      item.addEventListener('pointercancel', () => clearTimeout(pressTimer));
    }

    area.appendChild(item);
  });

  if (h < curH) {
    // past hour: adding tasks is locked (pointer-events: none handles visuals)
  } else if (tasks.length < 3) {
    area.addEventListener('click', (e) => {
      if (e.target.closest('.task-item')) return;
      openNewTaskSheet(h);
    });
  } else {
    const lim = document.createElement('div');
    lim.className = 'task-limit-msg';
    lim.textContent = 'full';
    area.appendChild(lim);
  }

  block.appendChild(area);
}

// ── TIME INDICATOR ─────────────────────────────────────────────────────────
function updateTimeIndicator() {
  const ind = document.getElementById('time-indicator');
  const scrollArea = document.getElementById('scroll-area');
  const d = now();
  const h = d.getHours();
  const m = d.getMinutes();

  const hourHeight = getHourHeight();
  const scrollTop = scrollArea.scrollTop;
  const headerH = document.getElementById('header').offsetHeight;

  const posInDay = (h + m / 60) * hourHeight;
  const screenPos = posInDay - scrollTop + headerH;

  // Usar transform em vez de top para evitar reflow e jitter ao rolar
  ind.style.transform = `translateY(${screenPos - 4}px)`;
  ind.style.top = '0px';

  // Atualizar o label de hora atual (fix 3)
  const label = document.getElementById('time-label');
  if (label) {
    const hStr = h.toString().padStart(2, '0');
    const mStr = m.toString().padStart(2, '0');
    label.textContent = state.settings.format24
      ? `${hStr}:${mStr}`
      : (() => { const ampm = h < 12 ? 'AM' : 'PM'; const h12 = h % 12 || 12; return `${h12}:${mStr} ${ampm}`; })();
  }

  // Atualizar porcentagem do dia (fix 2)
  const totalMinutes = 24 * 60;
  const elapsedMinutes = h * 60 + m;
  const pct = Math.min(100, Math.round((elapsedMinutes / totalMinutes) * 100));
  const pctEl = document.getElementById('stat-day-pct');
  if (pctEl) pctEl.textContent = pct + '%';
}

function getHourHeight() {
  const block = document.querySelector('.hour-block');
  return block ? block.offsetHeight : 72;
}

// ── AUTO SCROLL TO CURRENT HOUR ────────────────────────────────────────────
function scrollToCurrent() {
  const h = now().getHours();
  const block = document.querySelector(`[data-hour="${h}"]`);
  if (!block) return;
  const scrollArea = document.getElementById('scroll-area');
  const offset = block.offsetTop - 60;
  scrollArea.scrollTo({ top: Math.max(0, offset), behavior: 'smooth' });
}

// ── TASK ACTIONS ───────────────────────────────────────────────────────────
function toggleTask(h, id) {
  const tasks = state.tasks[h] || [];
  const t = tasks.find(t => t.id === id);
  if (t) {
    t.done = !t.done;
    save();
    renderHours();
    renderHeader();
  }
}

function openNewTaskSheet(h) {
  if (h < now().getHours()) return; // past hours are locked
  const tasks = state.tasks[h] || [];
  if (tasks.length >= 3) { showToast('max 3 tasks per hour'); return; }

  openSheet({
    title: `New task · ${formatHour(h)}`,
    content: `
      <textarea class="task-input" id="new-task-text" maxlength="80" rows="2" placeholder="What will you do?"></textarea>
      <div class="char-count"><span id="new-char">0</span>/80</div>
    `,
    actions: [
      { label: 'Add task', cls: 'primary', handler: () => {
        const val = document.getElementById('new-task-text').value.trim();
        if (!val) { showToast('enter some text'); return; }
        if (!state.tasks[h]) state.tasks[h] = [];
        state.tasks[h].push({ id: uid(), text: val, done: false });
        save(); closeSheet(); renderHours(); renderHeader();
      }},
      { label: 'Cancel', cls: 'cancel', handler: closeSheet },
    ],
    onOpen: () => {
      const inp = document.getElementById('new-task-text');
      inp.focus();
      inp.addEventListener('input', () => {
        document.getElementById('new-char').textContent = inp.value.length;
      });
    }
  });
}

function openEditSheet(h, id) {
  const tasks = state.tasks[h] || [];
  const task = tasks.find(t => t.id === id);
  if (!task) return;

  const curH = now().getHours();
  const hourOptions = Array.from({length:24},(_,i) => {
    if (i < curH) return ''; // skip past hours
    return `<option value="${i}" ${i===h?'selected':''}>${formatHourSelect(i)}</option>`;
  }).join('');

  openSheet({
    title: 'Edit task',
    content: `
      <textarea class="task-input" id="edit-task-text" maxlength="80" rows="2">${escHtml(task.text)}</textarea>
      <div class="char-count"><span id="edit-char">${task.text.length}</span>/80</div>
      <div style="margin-top:12px;font-size:12px;color:var(--text-muted);font-family:var(--font-mono);margin-bottom:4px">move to hour</div>
      <select class="hour-select" id="edit-hour">${hourOptions}</select>
    `,
    actions: [
      { label: 'Save', cls: 'primary', handler: () => {
        const val = document.getElementById('edit-task-text').value.trim();
        if (!val) { showToast('enter some text'); return; }
        const newH = parseInt(document.getElementById('edit-hour').value);
        // remove from original
        state.tasks[h] = (state.tasks[h]||[]).filter(t=>t.id!==id);
        // add to new hour
        if (!state.tasks[newH]) state.tasks[newH] = [];
        if (newH !== h && state.tasks[newH].length >= 3) {
          showToast('target hour is full'); return;
        }
        task.text = val;
        state.tasks[newH].push(task);
        save(); closeSheet(); renderHours(); renderHeader();
      }},
      { label: 'Delete task', cls: 'danger', handler: () => {
        state.tasks[h] = (state.tasks[h]||[]).filter(t=>t.id!==id);
        save(); closeSheet(); renderHours(); renderHeader();
      }},
      { label: 'Cancel', cls: 'cancel', handler: closeSheet },
    ],
    onOpen: () => {
      const inp = document.getElementById('edit-task-text');
      inp.addEventListener('input', () => {
        document.getElementById('edit-char').textContent = inp.value.length;
      });
    }
  });
}

function openSettingsSheet() {
  const s = state.settings;
  const swatches = Object.entries(COLORS).map(([k,v]) =>
    `<div class="color-swatch ${s.accentColor===k?'active':''}" data-color="${k}" style="background:${v}"></div>`
  ).join('');

  openSheet({
    title: 'Settings',
    content: `
      <div class="settings-row">
        <div><div class="settings-label">24-hour clock</div></div>
        <div class="toggle ${s.format24?'on':''}" id="toggle-24h">
          <div class="toggle-thumb"></div>
        </div>
      </div>
      <div class="settings-row">
        <div><div class="settings-label">Minute markers</div><div class="settings-desc">:00 and :30 visual guides</div></div>
        <div class="toggle ${s.minuteMode?'on':''}" id="toggle-min">
          <div class="toggle-thumb"></div>
        </div>
      </div>
      <div class="settings-row">
        <div><div class="settings-label">Light mode</div></div>
        <div class="toggle ${s.theme==='light'?'on':''}" id="toggle-theme">
          <div class="toggle-thumb"></div>
        </div>
      </div>
      <div class="settings-row" style="flex-direction:column;align-items:flex-start;gap:10px;">
        <div class="settings-label">Accent color</div>
        <div class="color-swatches" id="color-swatches">${swatches}</div>
      </div>
    `,
    actions: [{ label: 'Done', cls: 'primary', handler: closeSheet }],
    onOpen: () => {
      document.getElementById('toggle-24h').addEventListener('click', () => {
        state.settings.format24 = !state.settings.format24;
        document.getElementById('toggle-24h').classList.toggle('on', state.settings.format24);
        save(); renderHours();
      });
      document.getElementById('toggle-min').addEventListener('click', () => {
        state.settings.minuteMode = !state.settings.minuteMode;
        document.getElementById('toggle-min').classList.toggle('on', state.settings.minuteMode);
        save(); renderHours();
      });
      document.getElementById('toggle-theme').addEventListener('click', () => {
        state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark';
        document.getElementById('toggle-theme').classList.toggle('on', state.settings.theme==='light');
        save(); applyTheme();
      });
      document.getElementById('color-swatches').addEventListener('click', (e) => {
        const sw = e.target.closest('.color-swatch');
        if (!sw) return;
        state.settings.accentColor = sw.dataset.color;
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
        sw.classList.add('active');
        save(); applyTheme();
      });
    }
  });
}

// ── SHEET ENGINE ───────────────────────────────────────────────────────────
let activeOverlay = null;

function openSheet({ title, content, actions, onOpen }) {
  closeSheet();
  const overlay = document.createElement('div');
  overlay.className = 'overlay';

  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-title">${escHtml(title)}</div>
    <div id="sheet-content">${content}</div>
    <div class="sheet-actions" id="sheet-actions"></div>
  `;

  const actionsEl = sheet.querySelector('#sheet-actions');
  actions.forEach(a => {
    const btn = document.createElement('button');
    btn.className = `action-btn ${a.cls || ''}`;
    btn.textContent = a.label;
    btn.addEventListener('click', a.handler);
    actionsEl.appendChild(btn);
  });

  overlay.appendChild(sheet);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSheet(); });
  document.body.appendChild(overlay);
  activeOverlay = overlay;

  if (onOpen) requestAnimationFrame(onOpen);
}

function closeSheet() {
  if (activeOverlay) {
    activeOverlay.remove();
    activeOverlay = null;
  }
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── MIDNIGHT RESET ─────────────────────────────────────────────────────────
function checkReset() {
  const today = todayStr();
  if (state.date && state.date !== today) {
    state.tasks = {};
    state.date = today;
    save();
    render();
  }
}

// ── EVENTS ─────────────────────────────────────────────────────────────────
document.getElementById('settings-btn').addEventListener('click', openSettingsSheet);
document.getElementById('scroll-area').addEventListener('scroll', updateTimeIndicator, { passive: true });

// ── INIT & TICK ────────────────────────────────────────────────────────────
load();
render();
scrollToCurrent();

// tick every 30s
setInterval(() => {
  checkReset();
  renderHeader();
  renderHours();
  updateTimeIndicator();
}, 30000);

// fast tick for indicator smoothness
setInterval(updateTimeIndicator, 10000);

window.addEventListener('resize', updateTimeIndicator);

// ── SERVICE WORKER REGISTRATION ────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
